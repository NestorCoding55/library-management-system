spring.application.name=backend

# --- MYSQL (Aiven) CONFIGURATION ---
# We use ${ENV_VARIABLES} so you can change settings without touching code.
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- ADMIN PASSWORD SETUP ---
admin.password.one=mypassword123
admin.password.two=mypassword456

# --- JPA / HIBERNATE ---
# 'update' is safe; it creates tables if missing but keeps your data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- FIX WARNINGS ---
spring.jpa.open-in-view=false